<div class="mas-tooltip_container">
  <div (mouseenter)="focusOnTarget($event);showTooltip()" (mouseleave)="LostfocusOnTarget();hideTooltip()">
    <span *ngIf="text" [innerHTML]="text"></span>
    <ng-content></ng-content>
  </div>
  <div #masTooltip class="mas-tooltip" *ngIf="isVisible" [ngClass]="placementToDisplay">
    <div class="mas-tooltip_padding-bar"></div>
    <div class="mas-tooltip_arrow"></div>
    <div class="mas-tooltip_inner">
      <div class="mas-tooltip_content" *ngIf="content">{{ content }}</div>
    </div>
  </div>
</div>
