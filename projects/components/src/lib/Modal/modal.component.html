<div *ngIf="showModal" class="mas-modal_container" (click)="closeModal()">
  <div class="modalThree" (click)="$event.stopPropagation()">
    <div [ngClass]="'mas-modal_header'">
      <span class="mas-modal_header-title">{{ title }}</span>
      <mas-icon-button
        #firstFocusable
        tabindex="-1"
        size="small"
        shape="rounded"
        variant="neutral"
        iconAlone="mas-x-outlined mas-math-and-finance--outlined mas-icon"
        (click)="closeModal()"
        (keydown)="handleKeydown($event, 'cancel')"
        aria-label="cancel"
      ></mas-icon-button>
    </div>
    <div class="mas-modal_content-scroll">
      <div class="mas-modal_content">
        <p class="mas-modal_content-text">{{ content }}</p>
        <div class="custom-ng-content"><ng-content></ng-content></div>
      </div>
    </div>

    <div class="mas-modal_footer" *ngIf="showCancelButton || showConfirmButton">
      <ng-container *ngIf="showConfirmButton">
        <mas-button
          tabindex="0"
          (keydown)="handleKeydown($event, 'confirm')"
          class="mas-modal_footer-confirm-btn"
          (click)="confirmAction()"
          variant="primary"
          size="small"
          #lastFocusable
          aria-label="confirm"
          >{{ confirmButtonLabel }}</mas-button
        >
      </ng-container>
      <ng-container *ngIf="showCancelButton">
        <mas-button
          tabindex="0"
          (keydown)="handleKeydown($event, 'confirm')"
          class="mas-modal_footer-cancel-btn"
          (click)="cancelAction()"
          variant="secondary"
          size="small"
          aria-label="cancel"
          >{{ cancelButtonLabel }}</mas-button
        >
      </ng-container>
    </div>
  </div>
</div>
