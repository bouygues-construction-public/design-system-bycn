<div class="mas-alert" [ngClass]="{ 'mas-alert--show ': alertShow, 'mas-alert--hide ': !alertShow }" *ngIf="show">
  <div class="mas-alert_icon mas-alert_type--{{ type }}">
    <i *ngIf="type === 'info'" class="mas-info-filled mas-security-and-warnings--filled"></i>
    <i *ngIf="type === 'error'" class="mas-x-circle-filled mas-math-and-finance--filled"></i>
    <i *ngIf="type === 'success'" class="mas-check-circle-filled mas-system-and-device--filled"></i>
    <i *ngIf="type === 'warning'" class="mas-warning-circle-filled mas-security-and-warnings--filled"></i>
  </div>
  <div class="mas-alert_content">
    <div class="mas-alert_title">
      <span class="mas-alert_title-label">
        {{ title }}
      </span>
      <div *ngIf="closeBtn" class="mas-alert_close" (click)="closeAlert()">
        <i class="mas-x-outlined mas-math-and-finance--outlined"></i>
      </div>
    </div>
    <div *ngIf="message" class="mas-alert_description">
      <span class="mas-alert_description-label">
        {{ message }}
      </span>
    </div>
  </div>
</div>
