<div
  class="mas-radio-button"
  [ngClass]="{ 'mas-radio-button--large': size === 'large', 'mas-radio-button--disabled': disabled }"
>
  <input
    #rbutton
    class="hidden-accessible"
    type="radio"
    id="{{ identifier }}"
    [checked]="checked"
    [disabled]="disabled"
    (focus)="_onInputFocus($event)"
    (blur)="_onInputBlur($event)"
    (change)="_onChange($event)"
    [name]="name"
    [value]="value"
  />
  <div class="mas-radio-button_touch-target" (click)="onClick($event)"></div>
  <div class="mas-radio-button-container" [ngClass]="{ 'mas-radio-button--active': checked }">
    <ng-container *ngIf="checked && size === 'small'">
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle id="radio" cx="4" cy="4" r="3" fill="white" />
      </svg>
    </ng-container>
    <ng-container *ngIf="checked && size === 'large'">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle id="radio" cx="6" cy="6" r="4" fill="white" />
      </svg>
    </ng-container>
  </div>
  <label *ngIf="labelText !== ''" [for]="identifier" class="mas-radio-button_label">{{ labelText }}</label>
</div>
